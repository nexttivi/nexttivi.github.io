<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXT TV - Tải Ứng Dụng</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Hiệu ứng ánh sáng nền (Glow Effect) */
        .glow-bg {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 42, 109, 0.25) 0%, rgba(5, 217, 232, 0.15) 50%, rgba(0, 0, 0, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 40px 28px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        /* Thiết kế Logo NEXT TV */
        .logo-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .logo-icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #FF2A6D, #9B51E0);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 8px 20px rgba(255, 42, 109, 0.4);
        }

        .logo-text {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .logo-text span {
            background: linear-gradient(135deg, #05D9E8, #FF2A6D);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            font-size: 15px;
            color: #a0a5b5;
            margin-bottom: 36px;
            line-height: 1.5;
        }

        /* Danh sách nút tải về */
        .download-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn-download {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            border-radius: 18px;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Style riêng cho nút Android Phone */
        .btn-phone {
            background: rgba(255, 255, 255, 0.06);
        }

        .btn-phone:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(5, 217, 232, 0.5);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(5, 217, 232, 0.2);
        }

        .btn-phone .btn-icon {
            color: #05D9E8;
        }

        /* Style riêng cho nút Android TV */
        .btn-tv {
            background: linear-gradient(135deg, rgba(255, 42, 109, 0.2), rgba(155, 81, 224, 0.2));
            border-color: rgba(255, 42, 109, 0.3);
        }

        .btn-tv:hover {
            background: linear-gradient(135deg, rgba(255, 42, 109, 0.4), rgba(155, 81, 224, 0.4));
            border-color: rgba(255, 42, 109, 0.7);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 42, 109, 0.3);
        }

        .btn-tv .btn-icon {
            color: #FF2A6D;
        }

        .btn-icon {
            font-size: 28px;
            margin-right: 16px;
            width: 36px;
            text-align: center;
        }

        .btn-text {
            text-align: left;
            flex-grow: 1;
        }

        .btn-text small {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8a8f9d;
            font-weight: 600;
        }

        .btn-text strong {
            display: block;
            font-size: 16px;
            font-weight: 700;
            margin-top: 2px;
        }

        .arrow-icon {
            font-size: 14px;
            color: #6c727f;
            transition: transform 0.3s ease;
        }

        .btn-download:hover .arrow-icon {
            transform: translateX(4px);
            color: #ffffff;
        }

        /* Footer */
        .footer {
            margin-top: 32px;
            font-size: 12px;
            color: #5c606b;
        }
    </style>
</head>
<body>

    <div class="glow-bg"></div>

    <div class="container">
        <div class="logo-box">
            <div class="logo-icon">
                <i class="fa-solid fa-play"></i>
            </div>
            <div class="logo-text">
                NEXT <span>TV</span>
            </div>
        </div>

        <p class="tagline">Trải nghiệm truyền hình và giải trí đỉnh cao chất lượng cao trên mọi thiết bị.</p>

        <div class="download-group">
            <a href="#" class="btn-download btn-phone">
                <div class="btn-icon">
                    <i class="fa-brands fa-android"></i>
                </div>
                <div class="btn-text">
                    <small>Tải APK cho</small>
                    <strong>Điện Thoại Android</strong>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>

            <a href="#" class="btn-download btn-tv">
                <div class="btn-icon">
                    <i class="fa-solid fa-tv"></i>
                </div>
                <div class="btn-text">
                    <small>Phiên bản tối ưu</small>
                    <strong>Android TV / Box</strong>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>
        </div>

        <div class="footer">
            &copy; 2026 NEXT TV. Phiên bản 1.0
        </div>
    </div>

</body>
</html>
